<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Estudiantes | Cloud Native</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <style>

        :root {
            --bg-main: #0f172a;
            --bg-card: #1e293b;
            --border-color: #334155;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #6366f1;
            --accent-hover: #4f46e5;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            font-family: 'Inter', 'Segoe UI', sans-serif;
            min-height: 100vh;
        }

        .card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5);
        }

        /* Tabla moderna y limpia */
        .table { color: var(--text-main); margin-bottom: 0; }
        .table thead th {
            background-color: rgba(51, 65, 85, 0.5);
            border-bottom: 2px solid var(--border-color);
            color: var(--text-muted);
            font-weight: 600;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            font-size: 0.85rem;
        }
        .table tbody tr { border-bottom: 1px solid var(--border-color); transition: all 0.2s; }
        .table tbody tr:hover { background-color: rgba(51, 65, 85, 0.3); }
        .table td { border: none; padding: 1rem 0.75rem; vertical-align: middle; }

        .btn-primary { background-color: var(--accent); border: none; padding: 0.5rem 1.2rem; border-radius: 8px; transition: 0.3s; }
        .btn-primary:hover { background-color: var(--accent-hover); box-shadow: 0 4px 12px rgba(99, 102, 241, 0.4); }

        .form-control {
            background-color: var(--bg-main);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            border-radius: 8px;
            padding: 0.6rem 1rem;
        }
        .form-control:focus {
            background-color: var(--bg-main);
            color: var(--text-main);
            border-color: var(--accent);
            box-shadow: 0 0 0 0.25rem rgba(99, 102, 241, 0.25);
        }

        .modal-content { background-color: var(--bg-card); border: 1px solid var(--border-color); border-radius: 16px; }
        .modal-header { border-bottom: 1px solid var(--border-color); }

        .loader-container { display: flex; justify-content: center; padding: 3rem; color: var(--accent); }
    </style>
</head>
<body>
    <div class="container py-5">
        <div class="d-flex justify-content-between align-items-center mb-5">
            <div>
                <h1 class="fw-bold mb-0"><i class="bi bi-cloud-check-fill text-primary me-2"></i>Portal de Estudiantes</h1>
                <p class="text-white-50 mb-0 mt-1">Conectado a MongoDB Atlas vía FastAPI</p>
            </div>
            <button class="btn btn-primary shadow-sm" onclick="mostrarModalCrear()">
                <i class="bi bi-plus-lg me-1"></i> Nuevo Registro
            </button>
        </div>

        <div id="alerta-error" class="alert alert-danger d-none" role="alert">
            <i class="bi bi-exclamation-triangle-fill me-2"></i> Error de conexión con la API.
        </div>

        <div class="card p-2">
            <div class="table-responsive">
                <table class="table align-middle">
                    <thead>
                        <tr>
                            <th>Nombre del Alumno</th>
                            <th>Contacto (Email)</th>
                            <th>Carrera</th>
                            <th class="text-center">Semestre</th>
                            <th class="text-end pe-4">Administrar</th>
                        </tr>
                    </thead>
                    <tbody id="lista-estudiantes">
                        </tbody>
                </table>
                <div id="loading-spinner" class="loader-container">
                    <div class="spinner-border" role="status">
                        <span class="visually-hidden">Cargando...</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="modalEstudiante" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content shadow-lg">
                <div class="modal-header">
                    <h5 class="modal-title fw-bold" id="modalTitulo">Agregar Estudiante</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body p-4">
                    <form id="formEstudiante">
                        <input type="hidden" id="estudianteId">
                        <div class="mb-3">
                            <label class="form-label text-muted small text-uppercase fw-bold">Nombre Completo</label>
                            <input type="text" id="nombre" class="form-control" placeholder="Ej. Ana Pérez" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label text-muted small text-uppercase fw-bold">Correo Electrónico</label>
                            <input type="email" id="email" class="form-control" placeholder="ana@ejemplo.com" required>
                        </div>
                        <div class="row">
                            <div class="col-md-8 mb-3">
                                <label class="form-label text-muted small text-uppercase fw-bold">Carrera</label>
                                <input type="text" id="carrera" class="form-control" placeholder="Ing. en Sistemas" required>
                            </div>
                            <div class="col-md-4 mb-4">
                                <label class="form-label text-muted small text-uppercase fw-bold">Semestre</label>
                                <input type="number" id="semestre" class="form-control" min="1" max="12" required>
                            </div>
                        </div>
                        <button type="submit" class="btn btn-primary w-100 py-2 fw-bold">
                            <i class="bi bi-cloud-arrow-up-fill me-2"></i>Guardar en la Base de Datos
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>

        const API_BASE_URL = 'http://127.0.0.1:8000';

        const modal = new bootstrap.Modal(document.getElementById('modalEstudiante'));
        const form = document.getElementById('formEstudiante');
        let editando = false;

        async function cargarEstudiantes() {
            const tabla = document.getElementById('lista-estudiantes');
            const spinner = document.getElementById('loading-spinner');
            const alerta = document.getElementById('alerta-error');

            tabla.innerHTML = '';
            spinner.classList.remove('d-none');
            alerta.classList.add('d-none');

            try {
                // Hacemos fetch a la URL completa para respetar el desacoplamiento
                const res = await fetch(`${API_BASE_URL}/estudiantes`);
                if (!res.ok) throw new Error('Error en la red');

                const data = await res.json();
                spinner.classList.add('d-none');

                if (data.length === 0) {
                    tabla.innerHTML = `<tr><td colspan="5" class="text-center text-muted py-4">No hay estudiantes registrados.</td></tr>`;
                    return;
                }

                data.forEach(est => {
                    tabla.innerHTML += `
                        <tr>
                            <td class="fw-semibold">${est.nombre}</td>
                            <td><span class="badge text-bg-dark border border-secondary">${est.email}</span></td>
                            <td>${est.carrera}</td>
                            <td class="text-center"><span class="badge bg-primary rounded-pill">${est.semestre}</span></td>
                            <td class="text-end pe-4">
                                <button class="btn btn-sm btn-outline-light me-2" title="Editar" onclick="prepararEdicion('${est._id}', '${est.nombre}', '${est.email}', '${est.carrera}', ${est.semestre})">
                                    <i class="bi bi-pencil"></i>
                                </button>
                                <button class="btn btn-sm btn-outline-danger" title="Eliminar" onclick="eliminarEstudiante('${est._id}')">
                                    <i class="bi bi-trash3"></i>
                                </button>
                            </td>
                        </tr>
                    `;
                });
            } catch (error) {
                console.error("Error al cargar datos:", error);
                spinner.classList.add('d-none');
                alerta.classList.remove('d-none');
            }
        }

        async function eliminarEstudiante(id) {
            if(confirm('¿Confirmas la eliminación permanente de este registro?')) {
                try {
                    await fetch(`${API_BASE_URL}/estudiantes/${id}`, { method: 'DELETE' });
                    cargarEstudiantes();
                } catch (error) {
                    alert("Error al intentar eliminar.");
                }
            }
        }

        function mostrarModalCrear() {
            editando = false;
            form.reset();
            document.getElementById('modalTitulo').innerText = "Nuevo Estudiante";
            document.getElementById('estudianteId').value = '';
            modal.show();
        }

        function prepararEdicion(id, nombre, email, carrera, semestre) {
            editando = true;
            document.getElementById('estudianteId').value = id;
            document.getElementById('nombre').value = nombre;
            document.getElementById('email').value = email;
            document.getElementById('carrera').value = carrera;
            document.getElementById('semestre').value = semestre;
            document.getElementById('modalTitulo').innerText = "Actualizar Estudiante";
            modal.show();
        }

        form.onsubmit = async (e) => {
            e.preventDefault();
            const id = document.getElementById('estudianteId').value;
            const datos = {
                nombre: document.getElementById('nombre').value,
                email: document.getElementById('email').value,
                carrera: document.getElementById('carrera').value,
                semestre: parseInt(document.getElementById('semestre').value)
            };

            const url = editando ? `${API_BASE_URL}/estudiantes/${id}` : `${API_BASE_URL}/estudiantes`;
            const metodo = editando ? 'PUT' : 'POST';

            try {
                await fetch(url, {
                    method: metodo,
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(datos)
                });
                modal.hide();
                cargarEstudiantes();
            } catch (error) {
                alert("Hubo un error al guardar los datos. Revisa la consola.");
            }
        };

        window.onload = cargarEstudiantes;
    </script>
</body>
</html>
