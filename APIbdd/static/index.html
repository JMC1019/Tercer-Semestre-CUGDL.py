<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloud Portal | Estudiantes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-dark: #0b1120;
            --bg-card: #1e293b;
            --primary-accent: #3b82f6;
            --border-subtle: #334155;
            --text-muted: #94a3b8;
        }
        body { background-color: var(--bg-dark); font-family: 'Inter', sans-serif; color: #f8fafc; min-height: 100vh; }
        .hero-banner { background: linear-gradient(to right, rgba(11, 17, 32, 0.9), rgba(11, 17, 32, 0.7)), url('https://images.unsplash.com/photo-1451187580459-43490279c0fa?q=80&w=2072&auto=format&fit=crop') center/cover; padding: 4rem 2rem; border-bottom: 1px solid var(--border-subtle); box-shadow: 0 4px 30px rgba(0,0,0,0.5); }
        .glass-card { background-color: rgba(30, 41, 59, 0.9); border: 1px solid var(--border-subtle); border-radius: 16px; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.3); margin-top: -3rem; }
        .table { --bs-table-bg: transparent; --bs-table-color: #f8fafc; --bs-table-border-color: var(--border-subtle); }
        .table thead th { text-transform: uppercase; font-size: 0.75rem; letter-spacing: 1px; color: var(--text-muted); }
        .table tbody tr:hover { background-color: rgba(51, 65, 85, 0.5); }
        .avatar-img { width: 45px; height: 45px; border-radius: 12px; object-fit: cover; border: 2px solid var(--border-subtle); }
        .form-control, .form-select { background-color: #0f172a; border: 1px solid var(--border-subtle); color: white; border-radius: 8px; }
        .form-control:focus { background-color: #0f172a; border-color: var(--primary-accent); color: white; }
        .modal-content { background-color: var(--bg-card); border: 1px solid var(--border-subtle); border-radius: 16px; }
        .toast-container { position: fixed; bottom: 1rem; right: 1rem; z-index: 1060; }
    </style>
</head>
<body>

    <div class="hero-banner d-flex justify-content-between align-items-center">
        <div>
            <h1 class="fw-bold display-5 text-white mb-1"><i class="bi bi-hexagon-fill text-primary me-3"></i>Data<span class="text-primary">Cloud</span></h1>
            <p class="text-white-50 fs-5 mb-0">Gestión de Estudiantes Serverless</p>
        </div>
        <button class="btn btn-primary" onclick="mostrarModalCrear()"><i class="bi bi-person-plus-fill me-2"></i>Añadir Estudiante</button>
    </div>

    <div class="container pb-5">
        <div class="glass-card p-4">
            <div class="table-responsive">
                <table class="table align-middle">
                    <thead>
                        <tr><th>Estudiante</th><th>Contacto</th><th>Carrera</th><th class="text-center">Semestre</th><th class="text-end pe-3">Acciones</th></tr>
                    </thead>
                    <tbody id="lista-estudiantes"></tbody>
                </table>
            </div>
            <div id="loading-spinner" class="text-center py-5 text-primary d-none">
                <div class="spinner-border" role="status"></div><p class="mt-2 text-white-50">Consultando a FastAPI...</p>
            </div>
        </div>
    </div>

    <div class="modal fade" id="modalEstudiante" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header border-bottom border-secondary">
                    <h5 class="modal-title fw-bold" id="modalTitleText">Nuevo Estudiante</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body p-4">
                    <form id="formEstudiante">
                        <input type="hidden" id="estudianteId">
                        <div class="mb-3">
                            <label class="form-label text-white-50 small fw-bold">NOMBRE COMPLETO</label>
                            <input type="text" id="nombre" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label text-white-50 small fw-bold">CORREO INSTITUCIONAL</label>
                            <input type="email" id="email" class="form-control" required>
                        </div>
                        <div class="row">
                            <div class="col-md-7 mb-4">
                                <label class="form-label text-white-50 small fw-bold">CARRERA</label>
                                <input type="text" id="carrera" class="form-control" required>
                            </div>
                            <div class="col-md-5 mb-4">
                                <label class="form-label text-white-50 small fw-bold">SEMESTRE</label>
                                <input type="number" id="semestre" class="form-control" min="1" max="12" required>
                            </div>
                        </div>
                        <button type="submit" class="btn btn-primary w-100 py-3 fw-bold" id="btnSubmit">Guardar Registro</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <div class="toast-container"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const API_BASE_URL = 'http://localhost:8000';
        const modal = new bootstrap.Modal(document.getElementById('modalEstudiante'));
        const form = document.getElementById('formEstudiante');
        let editando = false;

        function mostrarToast(mensaje, esError = false) {
            const container = document.querySelector('.toast-container');
            const bgClass = esError ? 'text-bg-danger' : 'text-bg-success';
            const html = `
                <div class="toast align-items-center ${bgClass} border-0 show mb-2">
                    <div class="d-flex">
                        <div class="toast-body fw-semibold">${mensaje}</div>
                        <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
                    </div>
                </div>`;
            container.insertAdjacentHTML('beforeend', html);
            const toasts = container.querySelectorAll('.toast');
            setTimeout(() => toasts[toasts.length - 1].remove(), 3500);
        }

        async function cargarEstudiantes() {
            const tabla = document.getElementById('lista-estudiantes');
            tabla.innerHTML = '';
            try {
                const res = await fetch(`${API_BASE_URL}/estudiantes`);
                if (!res.ok) throw new Error('API no responde');
                const data = await res.json();

                data.forEach(est => {
                    // Fallback de seguridad por si Pydantic usa id o _id
                    const studentId = est.id || est._id;
                    const avatarUrl = `https://ui-avatars.com/api/?name=${encodeURIComponent(est.nombre)}&background=3b82f6&color=fff`;

                    tabla.innerHTML += `
                        <tr>
                            <td><div class="d-flex align-items-center"><img src="${avatarUrl}" class="avatar-img me-3"><div><div class="fw-bold">${est.nombre}</div><div class="text-white-50 small">ID: ${studentId.substring(0,8)}...</div></div></div></td>
                            <td>${est.email}</td>
                            <td><span class="badge border border-secondary">${est.carrera}</span></td>
                            <td class="text-center"><span class="badge bg-primary rounded-pill px-3 py-2">Semestre ${est.semestre}</span></td>
                            <td class="text-end pe-3">
                                <button class="btn btn-sm btn-outline-info me-2" onclick="prepararEdicion('${studentId}', '${est.nombre}', '${est.email}', '${est.carrera}', ${est.semestre})"><i class="bi bi-pencil-square"></i></button>
                                <button class="btn btn-sm btn-outline-danger" onclick="eliminarEstudiante('${studentId}')"><i class="bi bi-trash3-fill"></i></button>
                            </td>
                        </tr>`;
                });
            } catch (error) {
                console.error("Error al cargar:", error);
                mostrarToast('Error cargando estudiantes. Revisa la consola.', true);
            }
        }

        async function eliminarEstudiante(id) {
            if(!id || id === 'undefined') {
                mostrarToast('Error interno: ID no detectado.', true);
                return;
            }
            if(confirm('¿Eliminar este registro?')) {
                try {
                    const res = await fetch(`${API_BASE_URL}/estudiantes/${id}`, { method: 'DELETE' });
                    if(!res.ok) throw new Error('Fallo al eliminar');
                    mostrarToast('Estudiante eliminado');
                    cargarEstudiantes();
                } catch (error) {
                    console.error("Error al eliminar:", error);
                    mostrarToast('Error al intentar eliminar', true);
                }
            }
        }

        function mostrarModalCrear() {
            editando = false;
            form.reset();
            document.getElementById('estudianteId').value = '';
            document.getElementById('modalTitleText').innerText = "Nuevo Estudiante";
            modal.show();
        }

        function prepararEdicion(id, nombre, email, carrera, semestre) {
            editando = true;
            document.getElementById('estudianteId').value = id;
            document.getElementById('nombre').value = nombre;
            document.getElementById('email').value = email;
            document.getElementById('carrera').value = carrera;
            document.getElementById('semestre').value = semestre;
            document.getElementById('modalTitleText').innerText = "Actualizar Datos";
            modal.show();
        }

        form.onsubmit = async (e) => {
            e.preventDefault();
            const id = document.getElementById('estudianteId').value;

            // Garantizar que semestre se mande como número entero (Requisito de FastAPI)
            const datos = {
                nombre: document.getElementById('nombre').value,
                email: document.getElementById('email').value,
                carrera: document.getElementById('carrera').value,
                semestre: parseInt(document.getElementById('semestre').value, 10)
            };

            const url = editando ? `${API_BASE_URL}/estudiantes/${id}` : `${API_BASE_URL}/estudiantes`;
            const metodo = editando ? 'PUT' : 'POST';

            try {
                console.log(`Enviando petición ${metodo} a: ${url}`);
                console.log("Datos:", JSON.stringify(datos));

                const res = await fetch(url, {
                    method: metodo,
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(datos)
                });

                if(!res.ok) {
                    const errDetail = await res.text();
                    console.error("Detalle del error del servidor:", errDetail);
                    throw new Error(`Error ${res.status}: ${errDetail}`);
                }

                modal.hide();
                mostrarToast(editando ? 'Actualizado con éxito' : 'Registrado con éxito');
                cargarEstudiantes();

            } catch (error) {
                console.error("Excepción capturada:", error);
                mostrarToast('Error al comunicar con la API. Presiona F12 y mira la consola.', true);
            }
        };

        window.onload = cargarEstudiantes;
    </script>
</body>
</html>
